title: Budget Atlas
description: A budget document PR review prototype
# Default project site: https://afomi.github.io/budget-prototype/
url: "https://afomi.github.io"
baseurl: "/budget-prototype"
destination: _site
encoding: utf-8
markdown: kramdown
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - budget.schema.json
  - README.md
  - docs
  - scripts
  - tests
  - artifacts
  - vendor
  - .bundle
  - .gitignore
  - .jekyll-cache
  - .DS_Store
