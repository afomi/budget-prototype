{% assign states = include.steps | default: site.data.lifecycle.activities %}
<nav class="process-states" aria-label="{{ include.title | default: 'Budget lifecycle steps' | escape }}"{% if include.mode == 'city' %} data-case-state-list{% endif %}>
 <div class="process-states-heading"><h3>{{ include.title | default: 'Budget lifecycle steps' }}</h3><span>{{ states.size }} states</span></div>
 <ol>{% for step in states %}<li>{% if include.mode == 'select' %}<button type="button" id="activity-{{ step.id }}" data-activity-id="{{ step.id }}" aria-controls="lifecycle-example" aria-pressed="{% if forloop.first %}true{% else %}false{% endif %}">{% else %}{% if include.mode == 'city' %}{% if step.artifact == 'github' %}{% assign target = site.data.city_github.pull_request.url | default: 'https://github.com/afomi/budget-prototype/pulls' %}{% else %}{% assign target = step.artifact | relative_url %}{% endif %}{% else %}{% capture target %}{{ '/reference/federal/' | relative_url }}#activity-{{ step.id }}{% endcapture %}{% endif %}<a href="{{ target }}" data-state-id="{{ step.id }}">{% endif %}<span class="process-state-number">{{ forloop.index }}</span><span class="process-state-copy"><strong>{{ step.name }}</strong><small>{{ step.actor | default: step.owner }}</small>{% if include.mode == 'city' %}<span class="process-state-status" data-state-status>Pending</span>{% endif %}</span>{% if include.mode == 'select' %}</button>{% else %}</a>{% endif %}</li>{% endfor %}</ol>
</nav>
